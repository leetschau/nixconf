# flag f only for GUI apps. Do NOT add it with TUI apps, such as `treemd`.
ext azw3, has ebook-viewer, flag f = ebook-viewer "$@"
ext djvu, has zathura, flag f = zathura "$@"
ext docx?, has libreoffice, flag f = libreoffice "$@"
ext epub, has foliate, flag f = foliate "$@"
ext html, has chromium-browser, flag f = chromium-browser "$@"
ext jpg, has xviewer, flag f = xviewer -- "$@"
ext md, has treemd = treemd "$@"
ext mp3, has celluloid, flag f = celluloid -- "$@"
ext mp4, has totem, flag f = totem -- "$@"
ext mobi, has ebook-viewer, flag f = ebook-viewer "$@"
ext pdf, has mupdf, flag f = mupdf -- "$@"
ext pptx?, has libreoffice, flag f = libreoffice "$@"
ext rtf, has libreoffice, flag f = libreoffice "$@"
ext xlsx?, has libreoffice, flag f = libreoffice "$@"
